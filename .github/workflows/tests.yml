name: tests

on:
  push:
    branches: [main]
  pull_request:

# The data branches are force-pushed constantly by every machine. Running CI on
# them would be noise, and they contain no code.
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 is what macOS ships and what the Stop hook actually runs, so it is
        # not optional: a 3.10-only syntax slip would break the hook silently.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/*.test.mjs
