<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Claude Code — Mission Control</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-dot" aria-hidden="true"></span>
      <h1>Work Progress</h1>
      <span class="machine-chip" id="machine-chip" title="Machine reporting data">—</span>
    </div>
    <div class="topbar-right">
      <span id="status-line" class="status-line" title="When the data was last generated">…</span>
      <button id="refresh-btn" class="icon-btn" title="Refresh now" aria-label="Refresh now">↻</button>
      <button id="theme-btn" class="icon-btn" title="Toggle light/dark" aria-label="Toggle light/dark">◐</button>
    </div>
  </header>

  <!-- top strip: overall + stat tiles -->
  <section class="strip" aria-label="Overview">
    <div class="panel hero-panel">
      <div class="hero-figure" id="hero-pct">—</div>
      <div class="hero-caption">overall progress</div>
      <div class="hero-sub" id="hero-sub">&nbsp;</div>
      <div class="meter meter-lg"><div id="hero-fill" class="meter-fill"></div></div>
    </div>
    <div class="tiles">
      <div class="panel tile"><span class="tile-value" id="kpi-live">—</span><span class="tile-label">running now</span></div>
      <div class="panel tile"><span class="tile-value" id="kpi-projects">—</span><span class="tile-label">projects</span></div>
      <div class="panel tile"><span class="tile-value" id="kpi-stages">—</span><span class="tile-label">stages</span></div>
      <div class="panel tile"><span class="tile-value" id="kpi-machines">—</span><span class="tile-label">machines</span></div>
    </div>
  </section>

  <!-- LIVE NOW: every running session, one card each -->
  <section class="live-section" id="live-section" aria-label="Running now">
    <div class="section-head live-head">
      <span class="pulse" aria-hidden="true"></span>
      <span class="sh-label">Running now</span>
      <span class="sh-count" id="live-count">0</span>
    </div>
    <div class="live-grid" id="live-grid"></div>
  </section>

  <!-- machine switcher: All / each machine -->
  <nav id="machine-switcher" class="machine-switcher" aria-label="Switch machine"></nav>

  <div class="workspace">
    <!-- left rail: search, filters, tools -->
    <aside class="rail" aria-label="Filters">
      <input id="search" class="search" type="search" placeholder="Search…" autocomplete="off" />
      <nav class="tabs" id="tabs">
        <button class="tab active" data-filter="all">All <span class="count" id="cnt-all"></span></button>
        <button class="tab" data-filter="live">● Live <span class="count" id="cnt-live"></span></button>
        <button class="tab" data-filter="doing">◐ In progress <span class="count" id="cnt-doing"></span></button>
        <button class="tab" data-filter="done">✓ Done <span class="count" id="cnt-done"></span></button>
        <button class="tab" data-filter="hidden">⊘ Hidden <span class="count" id="cnt-hidden"></span></button>
      </nav>
      <div class="rail-tools">
        <button id="expand-all" class="tool-btn" title="Expand everything">⊞ Expand all</button>
        <button id="collapse-all" class="tool-btn" title="Collapse everything">⊟ Collapse all</button>
      </div>
      <div class="rail-foot">
        <span>edits private to you</span>
        <span>auto-refresh 20s</span>
      </div>
    </aside>

    <!-- project panels -->
    <main id="panels" class="panels" aria-label="Projects"></main>
  </div>

  <div id="empty" class="empty" hidden><p>Nothing matches. Clear the search or switch to the <b>All</b> tab.</p></div>
  <div id="error" class="error" hidden></div>

  <script src="./app.js" defer></script>
</body>
</html>
